<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6B7280" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#F4F6F8" />

  <text x="40" y="40" font-size="20" font-weight="700" fill="#1E2A38">Supply Chain Analytics Engine — Architecture</text>

  <!-- Raw data -->
  <rect x="40" y="80" width="140" height="90" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="55" y="108" font-size="12" font-weight="600" fill="#1E2A38">Raw CSV</text>
  <text x="55" y="128" font-size="10" fill="#374151">DataCo dataset</text>
  <text x="55" y="144" font-size="10" fill="#374151">180,519 rows</text>
  <text x="55" y="158" font-size="10" fill="#374151">53 columns</text>

  <line x1="180" y1="125" x2="230" y2="125" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pandas cleaning -->
  <rect x="230" y="80" width="160" height="90" rx="8" fill="#FFFFFF" stroke="#1E2A38" stroke-width="2"/>
  <text x="245" y="108" font-size="12" font-weight="600" fill="#1E2A38">Pandas Cleaning</text>
  <text x="245" y="128" font-size="10" fill="#374151">Drop PII, parse dates,</text>
  <text x="245" y="142" font-size="10" fill="#374151">validate fields</text>
  <text x="245" y="158" font-size="10" fill="#374151">→ Parquet (41 cols)</text>

  <line x1="390" y1="125" x2="440" y2="125" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PySpark aggregation -->
  <rect x="440" y="80" width="180" height="90" rx="8" fill="#FFFFFF" stroke="#3B82C4" stroke-width="2"/>
  <text x="455" y="108" font-size="12" font-weight="600" fill="#1E2A38">PySpark Aggregation</text>
  <text x="455" y="128" font-size="10" fill="#374151">GroupBy: region, shipping</text>
  <text x="455" y="142" font-size="10" fill="#374151">mode, category, status</text>
  <text x="455" y="158" font-size="10" fill="#374151">4 aggregation tables</text>

  <!-- Split to S3 and Postgres -->
  <line x1="530" y1="170" x2="530" y2="210" stroke="#6B7280" stroke-width="2"/>
  <line x1="300" y1="210" x2="760" y2="210" stroke="#6B7280" stroke-width="2"/>
  <line x1="300" y1="210" x2="300" y2="250" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="210" x2="760" y2="250" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- S3 -->
  <rect x="200" y="250" width="200" height="110" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="2"/>
  <text x="215" y="278" font-size="12" font-weight="600" fill="#1E2A38">AWS S3 (data lake)</text>
  <text x="215" y="298" font-size="10" fill="#374151">raw/dataco_supply_chain.csv</text>
  <text x="215" y="314" font-size="10" fill="#374151">processed/cleaned_orders.parquet</text>
  <text x="215" y="330" font-size="10" fill="#374151">processed/aggregations/*.csv</text>
  <text x="215" y="348" font-size="10" fill="#6B7280">Cold storage, full history</text>

  <!-- Postgres -->
  <rect x="660" y="250" width="200" height="110" rx="8" fill="#FFFFFF" stroke="#1B7A43" stroke-width="2"/>
  <text x="675" y="278" font-size="12" font-weight="600" fill="#1E2A38">PostgreSQL (Supabase)</text>
  <text x="675" y="298" font-size="10" fill="#374151">region_stats</text>
  <text x="675" y="313" font-size="10" fill="#374151">shipping_mode_stats</text>
  <text x="675" y="328" font-size="10" fill="#374151">category_stats · status_stats</text>
  <text x="675" y="346" font-size="10" fill="#6B7280">Serving layer, fast reads</text>

  <line x1="760" y1="360" x2="760" y2="410" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Flask API -->
  <rect x="620" y="410" width="280" height="80" rx="8" fill="#FFFFFF" stroke="#3B82C4" stroke-width="2"/>
  <text x="635" y="435" font-size="12" font-weight="600" fill="#1E2A38">Flask API (Render)</text>
  <text x="635" y="454" font-size="10" fill="#374151">/api/stats/regions, /shipping-modes,</text>
  <text x="635" y="468" font-size="10" fill="#374151">/categories, /status, /summary</text>

  <line x1="760" y1="490" x2="760" y2="530" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Dashboard -->
  <rect x="600" y="530" width="320" height="60" rx="8" fill="#1E2A38"/>
  <text x="615" y="555" font-size="12" font-weight="600" fill="#FFFFFF">React Dashboard (Vercel)</text>
  <text x="615" y="574" font-size="10" fill="#D1D5DB">Recharts: bar, pie — live data on load</text>

  <!-- Docker note -->
  <rect x="40" y="410" width="260" height="140" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="55" y="435" font-size="12" font-weight="600" fill="#1E2A38">Containerized pipeline</text>
  <text x="55" y="456" font-size="10" fill="#374151">Docker image runs:</text>
  <text x="55" y="472" font-size="10" fill="#374151">clean → aggregate →</text>
  <text x="55" y="488" font-size="10" fill="#374151">upload to S3 → load to Postgres</text>
  <text x="55" y="508" font-size="10" fill="#6B7280">Decoupled from the live API/</text>
  <text x="55" y="522" font-size="10" fill="#6B7280">dashboard — can be re-run</text>
  <text x="55" y="536" font-size="10" fill="#6B7280">independently or scheduled</text>

</svg>
